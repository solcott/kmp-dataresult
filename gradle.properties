org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Enables parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Otherwise KGP adds kotlin-dom-api-compat to every JS compilation and publishes it as an `api`
# dependency of the JS artifact. Nothing here touches the DOM, and dependency analysis (buildHealth)
# flags it as unused.
kotlin.js.stdlib.dom.api.included=false

group=io.github.solcott
version=0.1.0-SNAPSHOT
