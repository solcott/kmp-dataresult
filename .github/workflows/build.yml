name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS, not ubuntu: the Apple targets only compile on a Mac, and `build` covers every target.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # These root tasks also reach the included build-logic. The root build.gradle.kts wires
      # ktfmtCheck, checkSortDependencies and check to build-logic's own tasks, so it needs no
      # separate `-p build-logic` step.
      - name: Check formatting
        run: ./gradlew ktfmtCheck

      - name: Check dependency sorting
        run: ./gradlew checkSortDependencies

      # Fails on any dependency-analysis finding (see `dependencyAnalysis` in the root build).
      # No separate ABI step: `build` runs `check`, which includes checkKotlinAbi.
      - name: Check dependency health
        run: ./gradlew buildHealth

      - name: Build
        run: ./gradlew build
