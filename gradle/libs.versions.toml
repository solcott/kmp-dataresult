[versions]
agp = "9.4.0"
kotlin = "2.4.20"

androidCompileSdk = "37"
# Deliberately low: these modules touch no Android API, so a permissive floor costs nothing and
# keeps the library usable from anything.
androidMinSdk = "21"

# The toolchain compiles and runs on 25; published bytecode stays at 17. Both are pinned per
# JVM target in `kmp-library`, because a toolchain silently raises jvmTarget to its own version.
jvm-toolchain = "25" # After updating run ./gradlew updateDaemonJvm
jvm-compat = "17"

kotlinx-coroutines = "1.11.0"

# Adapter targets. These pin the *minimum* API the adapters compile against; consumers are free
# to resolve forward.
apollo = "5.1.0"
# `isFromCache` lives here, not in apollo-runtime — a separate coordinate on its own version line.
apollo-normalized-cache = "1.0.7"
store = "5.1.0-beta01"
# Circuit, for `uistate-circuit`'s produceRetainedState. A floor, not a pin -- Gradle resolves
# upward, so a consumer ahead of this is fine.
circuit = "0.38.0"
# androidx Compose runtime, for `uistate-compose`. A floor, not a pin: this is what circuit-retained
# 0.38.0 already requires, so the module raises no consumer's version.
compose-runtime = "1.12.1"

# Build tooling
detekt = "2.0.0-alpha.6"
dependency-analysis = "3.19.1"
dependency-sorter = "0.21.0"
ktfmt = "0.27.0"
publish = "0.37.0"

# Test
molecule = "2.2.0"
# Test-only, for dataresult-apollo, whose tests touch okio types through apollo-api. This is the
# version apollo-api 5.1.0 already resolves, so declaring it changes nothing on the classpath.
okio = "3.16.2"
turbine = "1.2.1"

[libraries]
apollo-api = { module = "com.apollographql.apollo:apollo-api", version.ref = "apollo" }
apollo-normalized-cache = { module = "com.apollographql.cache:normalized-cache", version.ref = "apollo-normalized-cache" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
circuit-retained = { module = "com.slack.circuit:circuit-retained", version.ref = "circuit" }
circuit-runtime = { module = "com.slack.circuit:circuit-runtime", version.ref = "circuit" }
circuit-test = { module = "com.slack.circuit:circuit-test", version.ref = "circuit" }
# camelCase, not `compose-runtime` / `compose-runtime-retain`: a dashed pair would make
# `libs.compose.runtime` a group accessor rather than a library.
composeRuntime = { module = "androidx.compose.runtime:runtime", version.ref = "compose-runtime" }
composeRuntimeRetain = { module = "androidx.compose.runtime:runtime-retain", version.ref = "compose-runtime" }
molecule-runtime = { module = "app.cash.molecule:molecule-runtime", version.ref = "molecule" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
store = { module = "org.mobilenativefoundation.store:store5", version.ref = "store" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Build-plugin classpath deps for build-logic.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-compose-rules = { module = "io.nlopez.compose.rules:detekt", version = "0.6.6" }

[plugins]
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
dependency-sorter = { id = "com.squareup.sort-dependencies", version.ref = "dependency-sorter" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
publish = { id = "com.vanniktech.maven.publish", version.ref = "publish" }
